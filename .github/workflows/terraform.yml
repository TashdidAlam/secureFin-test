# =============================================================================
# SecureFin Platform - Terraform CI/CD Pipeline
# =============================================================================
# 3-Job Pipeline: Plan → Apply → Validate
# Actions: Node.js 24 compatible (updated April 2026)
# Auth: OIDC Workload Identity Federation (zero secrets)
# =============================================================================

name: "Terraform CI/CD - SecureFin Platform"

on:
  pull_request:
    branches: [dev, staging, production]
    paths-ignore:
      - "docs/**"
  push:
    branches: [dev, staging, production]
    paths-ignore:
      - "docs/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-${{ github.base_ref || github.ref_name }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.5.0"
  TF_WORKING_DIR: "infra/terraform"

  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"

  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

# =============================================================================
# JOB 1: PLAN
# =============================================================================
jobs:
  plan:
    name: "Plan - ${{ github.base_ref || github.ref_name }}"
    runs-on: ubuntu-latest

    env:
      EFFECTIVE_BRANCH: ${{ github.base_ref || github.ref_name }}
      TF_ENVIRONMENT: ${{ (github.base_ref || github.ref_name) == 'production' && 'production' || (github.base_ref || github.ref_name) == 'staging' && 'staging' || 'dev' }}

    outputs:
      tf_environment: ${{ env.TF_ENVIRONMENT }}
      apply_allowed: ${{ steps.env-config.outputs.apply_allowed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # Detect environment
      # ------------------------------------------------------------
      - name: Detect environment
        id: env-config
        run: |
          BACKEND_HCL="environments/${{ env.TF_ENVIRONMENT }}/backend.hcl"
          TFVARS_FILE="environments/${{ env.TF_ENVIRONMENT }}/${{ env.TF_ENVIRONMENT }}.tfvars"

          echo "backend_hcl=${BACKEND_HCL}" >> "$GITHUB_OUTPUT"
          echo "tfvars_file=${TFVARS_FILE}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "apply_allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply_allowed=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------------
      # Setup
      # ------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ------------------------------------------------------------
      # Quality gates
      # ------------------------------------------------------------
      - name: Terraform Format
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: TFLint
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          tflint --init
          tflint

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ env.TF_WORKING_DIR }}
          framework: terraform
          soft_fail: true

      # ------------------------------------------------------------
      # Terraform
      # ------------------------------------------------------------
      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config=${{ steps.env-config.outputs.backend_hcl }}

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=${{ steps.env-config.outputs.tfvars_file }} \
            -out=tfplan \
            -input=false

      # ------------------------------------------------------------
      # Upload plan (only for push events)
      # ------------------------------------------------------------
      - name: Upload Plan Artifact
        if: steps.env-config.outputs.apply_allowed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}/tfplan

# =============================================================================
# JOB 2: APPLY (WITH APPROVAL)
# =============================================================================
  apply:
    name: "Apply - ${{ needs.plan.outputs.tf_environment }}"
    needs: plan
    if: needs.plan.outputs.apply_allowed == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # ✅ FIX: keeps approval WITHOUT breaking OIDC subject
    environment:
      name: ${{ needs.plan.outputs.tf_environment }}

    env:
      TF_ENVIRONMENT: ${{ needs.plan.outputs.tf_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          BACKEND_HCL="environments/${{ env.TF_ENVIRONMENT }}/backend.hcl"
          terraform init -backend-config=${BACKEND_HCL}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v7
        with:
          name: tfplan-${{ env.TF_ENVIRONMENT }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

# =============================================================================
# JOB 3: POST-DEPLOYMENT VALIDATION
# =============================================================================
  validate:
    name: "Validate - ${{ needs.plan.outputs.tf_environment }}"
    needs: [plan, apply]
    if: needs.apply.result == 'success'
    runs-on: ubuntu-latest

    env:
      TF_ENVIRONMENT: ${{ needs.plan.outputs.tf_environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Run Post-Deployment Validation
        shell: pwsh
        run: |
          ./scripts/Post-Deployment-Validation.ps1 -Environment ${{ env.TF_ENVIRONMENT }}